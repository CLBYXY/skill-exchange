<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户主页 | SkillLoop</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="profile">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">SL</span><span>SkillLoop</span></a>
      <nav class="top-nav" aria-label="主导航">
        <a href="index.html">技能交换市场</a>
        <a href="my.html">我的</a>
        <a href="messages.html">沟通</a>
      </nav>
      <div class="header-actions"><a class="publish-button" href="my.html#publish">发布需求</a></div>
    </header>

    <main class="my-page profile-page profile-work-only">
      <section class="work-list profile-skill-list">
        <article class="work-row"><article class="game-card micro art-photo rarity-master"><div class="game-card-top"><b>大师</b><span>应用</span></div><div class="game-card-art"></div></article><div class="work-row-main"><div class="work-row-head"><strong>手机摄影构图</strong><span>人像样片 9 张 · 自然光示例 · 周末可约</span><button type="button" data-profile-apply>申请交换</button></div><div class="work-tabs"><button class="active" type="button">作品展示</button><button type="button">课程评价</button></div><div class="work-preview"><span>链接：photo.example/lin</span><span>图片：构图样张</span><span>评价：讲解清楚</span></div></div></article>
        <article class="work-row"><article class="game-card micro art-video rarity-elite"><div class="game-card-top"><b>精英</b><span>应用</span></div><div class="game-card-art"></div></article><div class="work-row-main"><div class="work-row-head"><strong>短视频剪辑</strong><span>成片 2 条 · 镜头节奏 · 30min</span><button type="button" data-profile-apply>申请交换</button></div><div class="work-tabs"><button class="active" type="button">作品展示</button><button type="button">课程评价</button></div><div class="work-preview"><span>视频：15 秒样片</span><span>链接：video.example/lin</span><span>评价：节奏拆解有用</span></div></div></article>
        <article class="work-row"><article class="game-card micro art-anime rarity-apprentice"><div class="game-card-top"><b>学徒</b><span>应用</span></div><div class="game-card-art"></div></article><div class="work-row-main"><div class="work-row-head"><strong>动漫制作需求</strong><span>想学分镜和 5 秒循环动画</span><button type="button" data-profile-apply>申请交换</button></div><div class="work-tabs"><button class="active" type="button">交换目标</button><button type="button">学习记录</button></div><div class="work-preview"><span>目标：角色关键帧</span><span>时间：周六下午</span></div></div></article>
      </section>
    </main>

    <div class="toast" data-toast></div>
    <script src="assets/app.js"></script>
  </body>
</html>
