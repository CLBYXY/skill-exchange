<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillLoop | 猎物篮</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="basket">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="brand-mark">SL</span><span><strong>SkillLoop</strong><small>技能配对网站</small></span></a>
        <nav class="nav">
          <a href="index.html">今日</a><a href="profile.html">上传资料</a><a href="market.html">技能市场</a><a href="pet.html">宠物 AI</a><a class="active" href="basket.html">猎物篮 <span class="nav-count" data-basket-count>0</span></a><a href="matches.html">配对交换</a>
        </nav>
      </aside>
      <main class="main">
        <header class="topbar compact">
          <div><p class="eyebrow">不是购物车，是猎物篮</p><h1>勾选想交换的人，一键发起配对意向。</h1><p class="lead">加入篮子只是收藏。发起意向后，对方也必须选择你，才会进入可交换状态。</p></div>
        </header>
        <section class="basket-layout">
          <div class="panel">
            <div class="basket-head"><h2>我的猎物篮</h2><button class="button primary" data-request-selected>一键勾选换技能</button></div>
            <div data-basket-list></div>
          </div>
          <aside class="panel">
            <h2>交换前检查</h2>
            <ul class="check-list">
              <li>对方教的技能是否正好解决你的目标？</li>
              <li>你能提供的技能是否对对方有价值？</li>
              <li>时间是否至少有 2 周重合？</li>
              <li>双方是否都有作品或过往评价？</li>
            </ul>
            <div class="lock-note">发起后状态会进入“等待回选”。配对成功前仍不会开放联系方式。</div>
          </aside>
        </section>
      </main>
    </div>
    <div class="toast" data-toast></div>
    <script src="assets/app.js"></script>
  </body>
</html>
