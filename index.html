<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技能交换市场 | SkillLoop</title>
    <meta name="description" content="SkillLoop 技能交换市场，按随便逛逛、推荐、热门、周围浏览交换需求。" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="market">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark">SL</span><span>SkillLoop</span></a>
      <nav class="top-nav" aria-label="主导航">
        <a class="active" href="index.html">技能交换市场</a>
        <a href="my.html">我的</a>
        <a href="messages.html">沟通</a>
      </nav>
      <div class="header-actions">
        <label class="search-box">
          <span>⌕</span>
          <input data-search placeholder="搜索 摄影、剪辑、动漫制作、Python" />
        </label>
        <a class="publish-button" href="my.html#publish">发布需求</a>
      </div>
    </header>

    <main class="market-page">
      <section class="market-title">
        <div>
          <h1>技能交换市场</h1>
          <p>一个框就是一个交换需求。先看对方会什么、想换什么，再决定是否发起交换申请。</p>
        </div>
        <div class="market-summary">
          <strong>126</strong>
          <span>今日新增交换需求</span>
        </div>
      </section>

      <section class="mode-tabs" aria-label="市场筛选">
        <button class="active" data-mode="browse">随便逛逛</button>
        <button data-mode="recommend">推荐</button>
        <button data-mode="hot">热门</button>
        <button data-mode="nearby">周围</button>
      </section>

      <section class="feed-layout">
        <aside class="filter-panel">
          <h2>筛选</h2>
          <label>交换方式<select data-filter-type><option value="all">不限</option><option value="online">线上</option><option value="offline">线下</option></select></label>
          <label>时间<select data-filter-time><option value="all">不限</option><option value="weekend">周末</option><option value="weekday">工作日</option></select></label>
          <label>难度<select><option>不限</option><option>入门</option><option>进阶</option><option>作品级</option></select></label>
          <div class="rule-note">联系方式默认隐藏。只有双方互相同意交换后，才进入沟通和草案确认。</div>
        </aside>

        <section>
          <div class="feed-head">
            <h2 data-feed-title>随便逛逛</h2>
            <span data-result-count></span>
          </div>
          <div class="exchange-feed" data-exchange-feed></div>
        </section>
      </section>
    </main>

    <div class="toast" data-toast></div>
    <script src="assets/app.js"></script>
  </body>
</html>
