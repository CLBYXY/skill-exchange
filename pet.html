<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillLoop | 宠物 AI 海淘</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="pet">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html"><span class="brand-mark">SL</span><span><strong>SkillLoop</strong><small>技能配对网站</small></span></a>
        <nav class="nav">
          <a href="index.html">今日</a><a href="profile.html">上传资料</a><a href="market.html">技能市场</a><a class="active" href="pet.html">宠物 AI</a><a href="basket.html">猎物篮 <span class="nav-count" data-basket-count>0</span></a><a href="matches.html">配对交换</a>
        </nav>
      </aside>
      <main class="main">
        <header class="pet-hero">
          <div>
            <p class="eyebrow">Mochi AI</p>
            <h1>带上你的宠物去技能海淘。</h1>
            <p class="lead">Mochi 会根据你的护照、近期目标和时间偏好，模拟外出寻猎：它会带回几个“猎物”，并解释为什么值得放进猎物篮。</p>
            <button class="button primary" data-hunt>放 Mochi 出门</button>
          </div>
          <div class="big-pet" aria-hidden="true">ฅ(•ㅅ•)ฅ</div>
        </header>
        <section class="hunt-board">
          <div class="panel">
            <h2>今日寻猎口令</h2>
            <div class="prompt-card">“帮我找能教摄影构图、周末可约、愿意换 Python 数据分析的人。”</div>
            <div class="prompt-card">“过滤掉只想收费、不愿意互换、没有作品样例的人。”</div>
          </div>
          <div class="panel">
            <h2>Mochi 带回来的猎物</h2>
            <div class="profile-grid compact-grid" data-pet-picks></div>
          </div>
        </section>
      </main>
    </div>
    <div class="toast" data-toast></div>
    <script src="assets/app.js"></script>
